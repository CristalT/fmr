version: '3.8'

services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  db:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: 'fmr-site'
      # So you don't have to use root, but you can if you like
      MYSQL_USER: 'admin'
      # You can use whatever password you like
      MYSQL_PASSWORD: 'admin'
      # Password for root access
      MYSQL_ROOT_PASSWORD: 'admin'
    ports:
      - '33060:3306'
    volumes:
      - my-db:/var/lib/mysql

volumes:
  my-db:
  redis_data:
