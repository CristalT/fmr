name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  release:
    types: [published]

env:
  NODE_VERSION: '22.12.0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: npm run test:ui

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build project
        run: node ace build

      - name: Prepare build files
        run: |
          cp -r ./inertia ./build/inertia
          cp ./tailwind.config.js ./build/tailwind.config.js
          cp ./postcss.config.js ./build/postcss.config.js

      - name: Create build archive
        run: |
          cd build
          tar -czf ../build.tar.gz --exclude="node_modules" --exclude=".git" --exclude="*.log" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.release.tag_name }}
          path: build.tar.gz
          retention-days: 7

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.event.release.tag_name }}

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload via FTP
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
        run: |
          lftp -d -c "
            set ssl:verify-certificate no;
            set ssl:check-hostname no;
            set ftp:ssl-force on;
            set ftp:ssl-protect-data yes;
            open -u $FTP_USER,$FTP_PASSWORD $FTP_HOST;
            cd $FTP_REMOTE_PATH;
            put build.tar.gz;
            bye
          "
